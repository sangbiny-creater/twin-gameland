<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1E3A78">
<meta name="apple-mobile-web-app-title" content="은유와 은결">
<meta name="application-name" content="은유와 은결">
<title>은유와 은결</title>
<link rel="manifest" href="../hub/manifest.json?v=202611102225">
<link rel="apple-touch-icon" href="../hub/icons/icon-180.png?v=202611102225">
<link rel="icon" type="image/png" sizes="32x32" href="../hub/icons/favicon-32.png?v=202611102225">
<link rel="icon" type="image/png" sizes="16x16" href="../hub/icons/favicon-16.png?v=202611102225">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/icons/favicon-192.png?v=202611102225">
<link rel="shortcut icon" href="../favicon.ico?v=202611102225">
<link rel="preload" href="../common/fonts/jua.woff2?v=202611102225" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../common/popup.css?v=202611102225">
<link rel="stylesheet" href="tour.css?v=202611102225">
<!-- 화면을 한 번에 보여 주기: 그림·글꼴·처음 불러올 투어 정보가 다 준비될 때까지 가려 두고 한꺼번에 (common/boot.js) -->
<script src="../common/boot.js?v=202611102225"></script>
</head>
<body>
<!-- 그룹투어 (매표소). 지금은 있는 그림만 씀: 판·탭·줄·메달·테두리 = 랭킹 그림(ranking/assets), 투어 마크 = 첫 화면 로고 그림(hub/park/ui/logo_*), 창 = common/popup.css -->
<div class="tr">
  <header class="tr-head">
    <a class="tr-back" href="../index.html#lobby" aria-label="뒤로"><img src="../closet/assets/back.svg?v=202611102225" alt=""></a>
    <div class="tr-title"><img src="../ranking/assets/ui/title.webp?v=202611102225" alt=""><b>그룹투어</b></div>
  </header>

  <nav class="tr-tabs" id="tabs">
    <button data-tab="home" class="on"><img class="t-on" src="../ranking/assets/ui/tab_on.webp?v=202611102225" alt=""><img class="t-off" src="../ranking/assets/ui/tab_off.webp?v=202611102225" alt=""><b id="tabHome">투어 찾기</b></button>
    <button data-tab="event"><img class="t-on" src="../ranking/assets/ui/tab_on.webp?v=202611102225" alt=""><img class="t-off" src="../ranking/assets/ui/tab_off.webp?v=202611102225" alt=""><b>이벤트</b></button>
    <button data-tab="rank"><img class="t-on" src="../ranking/assets/ui/tab_on.webp?v=202611102225" alt=""><img class="t-off" src="../ranking/assets/ui/tab_off.webp?v=202611102225" alt=""><b>투어 랭킹</b></button>
  </nav>

  <main id="view" class="tr-view"></main>
</div>
<div id="toast" class="toast hidden"></div>

<!-- 창들 (버튼 줄은 common/popup.js 가 정해진 규칙대로) -->
<div id="popCreate" class="modal hidden">
  <div class="panel">
    <div class="p-title">투어 만들기</div>
    <label class="f-row"><span>투어 이름</span><input id="cName" maxlength="12" autocomplete="off" placeholder="투어 이름을 입력하세요"></label>
    <div class="f-row"><span>투어 마크</span></div>
    <div class="badges" id="cBadges"></div>
    <div class="f-row seg" id="cOpen"><button data-v="1" class="on">누구나 가입</button><button data-v="0">초대로만</button></div>
    <div class="row"><button class="btn-sub" data-close>닫기</button><button class="btn-main" id="cGo">만들기</button></div>
  </div>
</div>

<div id="popJoin" class="modal hidden">
  <div class="panel">
    <div class="p-title">투어 가입</div>
    <div class="j-card" id="jCard"></div>
    <p class="p-msg" id="jMsg"></p>
    <div class="row"><button class="btn-sub" data-close>닫기</button><button class="btn-main" id="jGo">가입</button></div>
  </div>
</div>

<div id="popCode" class="modal hidden">
  <div class="panel">
    <div class="p-title">초대 코드</div>
    <p class="p-msg">친구에게 받은 초대 코드 6자리를 넣어 주세요</p>
    <label class="f-row"><input id="codeIn" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC123" class="code-in"></label>
    <div class="row"><button class="btn-sub" data-close>닫기</button><button class="btn-main" id="codeGo">찾기</button></div>
  </div>
</div>

<div id="popInvite" class="modal hidden">
  <div class="panel">
    <div class="p-title">친구 초대</div>
    <p class="p-msg">이 코드나 링크를 친구에게 보내 주세요</p>
    <div class="code-big" id="invCode"></div>
    <div class="row"><button class="btn-sub" data-close>닫기</button><button class="btn-main" id="invShare">링크 보내기</button></div>
  </div>
</div>

<div id="popNotice" class="modal hidden">
  <div class="panel">
    <div class="p-title">공지 쓰기</div>
    <textarea id="ntIn" maxlength="100" rows="4" placeholder="투어 멤버들에게 알릴 말을 써 주세요"></textarea>
    <p class="p-msg small">새 공지를 올리면 지난 이모티콘은 지워져요</p>
    <div class="row"><button class="btn-sub" data-close>닫기</button><button class="btn-main" id="ntGo">올리기</button></div>
  </div>
</div>

<div id="popSet" class="modal hidden">
  <div class="panel">
    <div class="p-title">투어 설정</div>
    <label class="f-row"><span>투어 이름</span><input id="sName" maxlength="12" autocomplete="off"></label>
    <div class="badges" id="sBadges"></div>
    <div class="f-row seg" id="sOpen"><button data-v="1">누구나 가입</button><button data-v="0">초대로만</button></div>
    <div class="row"><button class="btn-sub" data-close>닫기</button><button class="btn-main" id="sGo">저장</button></div>
  </div>
</div>

<div id="popMember" class="modal hidden">
  <div class="panel">
    <div class="p-title" id="mTitle">투어멤버</div>
    <div class="m-face" id="mFace"></div>
    <p class="p-msg" id="mMsg"></p>
    <div class="row"><button class="btn-sub" id="mKick">내보내기</button><button class="btn-main" id="mLead">투어가이드 넘기기</button></div>
    <button class="gp-x" data-close aria-label="닫기"></button>
  </div>
</div>

<div id="popAsk" class="modal hidden">
  <div class="panel">
    <div class="p-title" id="askTitle">확인</div>
    <p class="p-msg" id="askMsg"></p>
    <div class="row"><button class="btn-sub" data-close>닫기</button><button class="btn-main" id="askGo">확인</button></div>
  </div>
</div>

<script src="../common/chars/looks.js?v=202611102225"></script>
<script src="../common/profile.js?v=202611102225"></script>
<script src="../common/i18n_data.js?v=202611102225"></script>
<script src="../common/i18n.js?v=202611102225"></script>
<script src="../common/ui.js?v=202611102225"></script>
<script src="../common/popup.js?v=202611102225"></script>
<script src="tour.js?v=202611102225"></script>
</body>
</html>
