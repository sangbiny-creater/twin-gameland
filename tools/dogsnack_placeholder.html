<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 멍멍이 간식 타임 임시 그림 (GPT 그림이 오기 전까지): tools/dogsnack_placeholder.py 가 헤드리스 크롬으로 캡처
     ?kind=card|port|land|shop&w=&h= — 두더지 게임 초원 배경 + 코드로 그린 강아지·간식 + 은유·은결 v3 + 글자 로고 -->
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script src="../common/chars/looks.js"></script>
<script src="../common/charv2.js"></script>
<script src="../dogsnack/art.js"></script>
<script>
const q = new URLSearchParams(location.search), kind = q.get('kind') || 'port', W = +q.get('w'), H = +q.get('h');
const c = document.getElementById('c'); c.width = W; c.height = H; const g = c.getContext('2d'), D = DogArt;
const bg = new Image(); bg.src = `../mole/assets/bg/${W > H ? 'land' : 'port'}.webp`;
CharV2.load('eunyu3'); CharV2.load('eungyeol3');
const COL = ['#FF8FB1', '#FFD34D', '#8FD0FF'];
function logo(cx, cy, k) {
  g.save(); g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.font = `${46 * k}px Jua`; g.lineWidth = 14 * k; g.strokeStyle = '#fff'; g.strokeText('은유와 은결의', cx, cy - 64 * k);
  g.fillStyle = '#C25E12'; g.fillText('은유와 은결의', cx, cy - 64 * k);
  g.font = `${92 * k}px Jua`;
  g.lineWidth = 26 * k; g.strokeStyle = '#5B3A22'; g.strokeText('멍멍이 간식 타임', cx, cy + 18 * k);
  g.lineWidth = 14 * k; g.strokeStyle = '#fff'; g.strokeText('멍멍이 간식 타임', cx, cy + 12 * k);
  const gr = g.createLinearGradient(0, cy - 40 * k, 0, cy + 50 * k); gr.addColorStop(0, '#FFD36B'); gr.addColorStop(1, '#FF9F2E');
  g.fillStyle = gr; g.fillText('멍멍이 간식 타임', cx, cy + 12 * k);
  g.font = `${30 * k}px Jua`; g.fillStyle = '#5B3A22'; g.fillText('Doggy Snack Time', cx, cy + 82 * k);
  g.restore();
}
// 장면: 초원에서 은유·은결이 간식을 던지고 강아지 3마리가 받아먹음
function scene(k, cx, dogY, chars) {
  const sc = Math.max(W / bg.naturalWidth, H / bg.naturalHeight); g.drawImage(bg, (W - bg.naturalWidth * sc) / 2, (H - bg.naturalHeight * sc) / 2, bg.naturalWidth * sc, bg.naturalHeight * sc);
  const lw = 170 * k;
  D.bone(g, cx - lw, dogY - 150 * k, k); D.sausage(g, cx, dogY - 260 * k, dogY - 90 * k, k); D.bone(g, cx + lw, dogY - 210 * k, k, { gold: true });
  for (let i = 0; i < 3; i++) {
    const x = cx + (i - 1) * lw;
    g.beginPath(); g.ellipse(x, dogY + 52 * k, 70 * k, 22 * k, 0, 0, Math.PI * 2); g.fillStyle = COL[i]; g.fill(); g.lineWidth = 3 * k; g.strokeStyle = '#fff'; g.stroke();
    D.dog(g, x, dogY, 1.15 * k, i, i === 1 ? 0.9 : 0, i === 1 ? 'idle' : 'happy', i);
  }
  if (chars) {
    const dx = Math.min(lw * 2.1, W / 2 - 95 * k);
    g.save(); g.translate(cx - dx, dogY + 70 * k); CharV2.draw(g, 'eunyu3', 'cheer', { h: 250 * k }); g.restore();
    g.save(); g.translate(cx + dx, dogY + 70 * k); CharV2.draw(g, 'eungyeol3', 'happy', { h: 250 * k, flip: true }); g.restore();
  }
}
function draw() {
  if (kind === 'port') { scene(1.5, W / 2, H * 0.66, true); logo(W / 2, H * 0.17, 1.35); }
  else if (kind === 'land') { scene(1.15, W / 2, H * 0.6, true); logo(W / 2, H * 0.17, 1.2); }
  else if (kind === 'card') { scene(0.72, W / 2, H * 0.52, true); logo(W / 2, H * 0.84, 0.55); }
  else if (kind === 'shop') { scene(0.32, W / 2, H * 0.7, false); }
  document.title = 'done';
}
const wait = () => (bg.complete && CharV2.ready('eunyu3') && CharV2.ready('eungyeol3') ? document.fonts.load('40px Jua').then(draw) : setTimeout(wait, 50));
wait();
</script></body></html>
