<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 다트 게임 임시 그림 (GPT 그림이 오기 전까지): tools/darts_placeholder.py 가 헤드리스 크롬으로 캡처
     ?kind=card|port|land&w=&h= — 코드로 그린 놀이공원 다트 부스 배경·다트판·다트 + 은유·은결 v3 + 글자 로고 -->
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script src="../common/chars/looks.js"></script>
<script src="../common/charv2.js"></script>
<script src="../darts/art.js"></script>
<script>
const q = new URLSearchParams(location.search), kind = q.get('kind') || 'port', W = +q.get('w'), H = +q.get('h');
const c = document.getElementById('c'); c.width = W; c.height = H; const g = c.getContext('2d'), D = DartArt;
CharV2.load('eunyu3'); CharV2.load('eungyeol3');
function logo(cx, cy, k) {
  g.save(); g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.font = `${46 * k}px Jua`; g.lineWidth = 14 * k; g.strokeStyle = '#fff'; g.strokeText('은유와 은결의', cx, cy - 64 * k);
  g.fillStyle = '#C25E12'; g.fillText('은유와 은결의', cx, cy - 64 * k);
  g.font = `${110 * k}px Jua`;
  g.lineWidth = 26 * k; g.strokeStyle = '#5B3A22'; g.strokeText('다트 게임', cx, cy + 22 * k);
  g.lineWidth = 14 * k; g.strokeStyle = '#fff'; g.strokeText('다트 게임', cx, cy + 16 * k);
  const gr = g.createLinearGradient(0, cy - 40 * k, 0, cy + 60 * k); gr.addColorStop(0, '#FF9CBC'); gr.addColorStop(1, '#E8456A');
  g.fillStyle = gr; g.fillText('다트 게임', cx, cy + 16 * k);
  g.font = `${30 * k}px Jua`; g.fillStyle = '#5B3A22'; g.fillText('Twin Darts', cx, cy + 92 * k);
  g.restore();
}
// 장면: 놀이공원 다트 부스, 다트판에 다트 몇 개, 은유는 던지는 자세·은결은 응원
function scene(k, cx, by, br, chars) {
  g.save(); g.scale(W / Math.max(540, W / 2), W / Math.max(540, W / 2)); D.bg(g, Math.max(540, W / 2), H / (W / Math.max(540, W / 2)), 0.1); g.restore();
  D.board(g, cx, by, br, { hi: { num: 50 }, hiA: 0.5 });
  D.dart(g, cx + 2, by - 3, br / 120, '#FF6B95');
  D.dart(g, cx + br * 0.4, by - br * 0.42, br / 120, '#4FA3FF');
  D.dart(g, cx - br * 0.2, by - br * 0.95, br / 120, '#FF6B95');
  if (chars) {
    const dx = Math.min(br * 1.55, W / 2 - 110 * k), fy = by + br * 1.45;
    g.save(); g.translate(cx - dx, fy); CharV2.draw(g, 'eunyu3', 'cheer', { h: 270 * k }); g.restore();
    g.save(); g.translate(cx + dx, fy); CharV2.draw(g, 'eungyeol3', 'happy', { h: 270 * k, flip: true }); g.restore();
  }
}
function draw() {
  if (kind === 'port') { scene(1.5, W / 2, H * 0.55, 300, true); logo(W / 2, H * 0.15, 1.35); }
  else if (kind === 'land') { scene(1.25, W / 2, H * 0.6, 165, true); logo(W / 2, H * 0.16, 1.15); }
  else if (kind === 'card') { scene(0.62, W / 2, H * 0.38, 105, true); logo(W / 2, H * 0.84, 0.55); }
  document.title = 'done';
}
const wait = () => (CharV2.ready('eunyu3') && CharV2.ready('eungyeol3') ? document.fonts.load('40px Jua').then(draw) : setTimeout(wait, 50));
wait();
</script></body></html>
