<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 케이크 탭탭 임시 그림 (GPT 그림이 오기 전까지): tools/caketap_placeholder.py 가 헤드리스 크롬으로 캡처
     ?kind=card|port|land|shop&w=&h= — 달콤 베이커리 배경·빵 그림 + 은유·은결 v3 + 글자 로고 -->
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script src="../common/chars/looks.js"></script>
<script src="../common/charv2.js"></script>
<script src="../bakery/art.js"></script>
<script>
const q = new URLSearchParams(location.search), kind = q.get('kind') || 'port', W = +q.get('w'), H = +q.get('h');
const c = document.getElementById('c'); c.width = W; c.height = H; const g = c.getContext('2d'), A = BakeryArt;
A.load('../bakery/assets/sprites/', 1);
const bg = new Image(); bg.src = `../bakery/assets/bg/${W > H ? 'land' : 'port'}.webp`;
CharV2.load('eunyu3'); CharV2.load('eungyeol3');
const COL = ['#FF8FB1', '#8FD0FF', '#FFD34D'];
function logo(cx, cy, k) {
  g.save(); g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.font = `${46 * k}px Jua`; g.lineWidth = 14 * k; g.strokeStyle = '#fff'; g.strokeText('은유와 은결의', cx, cy - 64 * k);
  g.fillStyle = '#C25E12'; g.fillText('은유와 은결의', cx, cy - 64 * k);
  g.font = `${104 * k}px Jua`;
  g.lineWidth = 26 * k; g.strokeStyle = '#7A2E4A'; g.strokeText('케이크 탭탭', cx, cy + 18 * k);
  g.lineWidth = 14 * k; g.strokeStyle = '#fff'; g.strokeText('케이크 탭탭', cx, cy + 12 * k);
  const gr = g.createLinearGradient(0, cy - 40 * k, 0, cy + 50 * k); gr.addColorStop(0, '#FF9CBC'); gr.addColorStop(1, '#FF5A8C');
  g.fillStyle = gr; g.fillText('케이크 탭탭', cx, cy + 12 * k);
  g.font = `${30 * k}px Jua`; g.fillStyle = '#7A2E4A'; g.fillText('Cake Tap Tap', cx, cy + 84 * k);
  g.restore();
}
function scene(k, cx, top, bottom, chars) {
  const sc = Math.max(W / bg.naturalWidth, H / bg.naturalHeight); g.drawImage(bg, (W - bg.naturalWidth * sc) / 2, (H - bg.naturalHeight * sc) / 2, bg.naturalWidth * sc, bg.naturalHeight * sc);
  g.fillStyle = 'rgba(60,30,60,.12)'; g.fillRect(0, 0, W, H);
  const lw = 150 * k;
  for (let i = 0; i < 3; i++) { const x = cx + (i - 1.5) * lw; g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.roundRect(x + 6 * k, top, lw - 12 * k, bottom - top, 22 * k); g.fill(); }
  const ys = [[0.25, 0.7], [0.5], [0.4, 0.85]];
  ys.forEach((arr, i) => arr.forEach((f) => A.cupcake(g, cx + (i - 1) * lw, top + (bottom - top) * f, k * 0.95, { cream: f > 0.8 ? 1 : 0, gold: i === 2 && f < 0.5 })));
  for (let i = 0; i < 3; i++) { const x = cx + (i - 1) * lw, y = bottom + 60 * k; g.beginPath(); g.arc(x, y, 50 * k, 0, 7); g.fillStyle = COL[i]; g.fill(); g.lineWidth = 5 * k; g.strokeStyle = '#fff'; g.stroke(); A.bag(g, x, y + 30 * k, k * 0.36, 0, '#FFC2D4'); }
  if (chars) {
    g.save(); g.translate(cx - Math.min(lw * 2.05, W / 2 - 95 * k), bottom + 110 * k); CharV2.draw(g, 'eunyu3', 'cheer', { h: 250 * k }); g.restore();
    g.save(); g.translate(cx + Math.min(lw * 2.05, W / 2 - 95 * k), bottom + 110 * k); CharV2.draw(g, 'eungyeol3', 'happy', { h: 250 * k, flip: true }); g.restore();
  }
}
function draw() {
  if (kind === 'port') { scene(1.6, W / 2, H * 0.36, H * 0.72, true); logo(W / 2, H * 0.17, 1.4); }
  else if (kind === 'land') { scene(1.25, W / 2, H * 0.34, H * 0.66, true); logo(W / 2, H * 0.17, 1.25); }
  else if (kind === 'card') { scene(0.8, W / 2, H * 0.06, H * 0.6, true); logo(W / 2, H * 0.84, 0.6); }
  else if (kind === 'shop') { scene(0.38, W / 2, H * 0.1, H * 0.7, false); }
  document.title = 'done';
}
const wait = () => (A.ready() && bg.complete && CharV2.ready('eunyu3') && CharV2.ready('eungyeol3') ? document.fonts.load('40px Jua').then(draw) : setTimeout(wait, 50));
wait();
</script></body></html>
