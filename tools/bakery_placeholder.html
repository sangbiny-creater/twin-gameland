<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 달콤 베이커리 임시 그림 만들기 (GPT 그림이 오기 전까지): tools/bakery_placeholder.py 가 헤드리스 크롬으로 캡처함
     ?kind=card|port|land|shop|slow&w=&h= -->
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script src="../common/chars/looks.js"></script>
<script src="../common/charv2.js"></script>
<script src="../bakery/art.js"></script>
<script>
const kind = new URLSearchParams(location.search).get('kind') || 'port'; // &w=&h= 그림 크기
const q = new URLSearchParams(location.search), c = document.getElementById('c'), W = +q.get('w'), H = +q.get('h');
c.width = W; c.height = H; const g = c.getContext('2d'), A = BakeryArt;
CharV2.load('eunyu3'); CharV2.load('eungyeol3');
function logo(cx, cy, k) {
  g.save(); g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.font = `${46 * k}px Jua`; g.lineWidth = 14 * k; g.strokeStyle = '#fff'; g.strokeText('은유와 은결의', cx, cy - 62 * k);
  g.fillStyle = '#C25E12'; g.fillText('은유와 은결의', cx, cy - 62 * k);
  g.font = `${96 * k}px Jua`;
  g.lineWidth = 26 * k; g.strokeStyle = '#7A2E4A'; g.strokeText('달콤 베이커리', cx, cy + 18 * k);
  g.lineWidth = 14 * k; g.strokeStyle = '#fff'; g.strokeText('달콤 베이커리', cx, cy + 12 * k);
  const gr = g.createLinearGradient(0, cy - 40 * k, 0, cy + 50 * k); gr.addColorStop(0, '#FF9CBC'); gr.addColorStop(1, '#FF5A8C');
  g.fillStyle = gr; g.fillText('달콤 베이커리', cx, cy + 12 * k);
  g.font = `${30 * k}px Jua`; g.fillStyle = '#7A2E4A'; g.fillText('Sweet Bakery', cx, cy + 82 * k);
  g.restore();
}
// 장면: 컨베이어 위 케이크 + 짤주머니 + 은유·은결
function scene(by, k, cx, spread) {
  A.backdrop(g, W, H, by + 60 * k, 0);
  for (let i = 0; i < 14; i++) A.heart(g, (i * 137) % W, (i * 89) % (by * 0.9), 10 * k + (i % 3) * 5 * k, true);
  A.belt(g, W, by, 40 * k, 0, k);
  const xs = [-2.2, -1.1, 0, 1.1, 2.2].map((v) => cx + v * spread);
  A.longBread(g, xs[0] - 70 * k, xs[1] + 30 * k, by, k, 0, [0, W], true);
  A.cupcake(g, xs[2], by, k, { v: 2, cream: 1 });
  A.cupcake(g, xs[3], by, k, { gold: true, cream: 1, t: 0.2 });
  A.cupcake(g, xs[4], by, k, { v: 0 });
  A.stream(g, xs[2], by - 230 * k, by - 120 * k, k);
  A.bag(g, xs[2], by - 228 * k, k * 1.2, 0.6);
  g.save(); g.translate(cx - spread * 1.7, by + 20 * k); CharV2.draw(g, 'eunyu3', 'cheer', { h: 260 * k }); g.restore();
  g.save(); g.translate(cx + spread * 1.75, by + 20 * k); CharV2.draw(g, 'eungyeol3', 'happy', { h: 260 * k, flip: true }); g.restore();
}
function turtle(cx, cy, r) {
  g.lineWidth = r * 0.06; g.strokeStyle = '#2E5A1E'; g.lineJoin = 'round';
  g.fillStyle = '#9BD86A'; [[-0.55, 0.45], [0.55, 0.45], [-0.4, 0.75], [0.4, 0.75]].forEach(([a, b]) => { g.beginPath(); g.ellipse(cx + a * r, cy + b * r * 0.5, r * 0.18, r * 0.14, 0, 0, 7); g.fill(); g.stroke(); });
  g.beginPath(); g.arc(cx + r * 0.78, cy + r * 0.05, r * 0.24, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#2E2A30'; g.beginPath(); g.arc(cx + r * 0.86, cy - r * 0.02, r * 0.05, 0, 7); g.fill();
  g.beginPath(); g.ellipse(cx, cy, r * 0.68, r * 0.5, 0, Math.PI, 0); g.lineTo(cx + r * 0.68, cy + r * 0.12); g.lineTo(cx - r * 0.68, cy + r * 0.12); g.closePath();
  g.fillStyle = '#58A83A'; g.fill(); g.stroke();
  g.fillStyle = '#7CC456'; [[-0.3, -0.18], [0.05, -0.28], [0.36, -0.14]].forEach(([a, b]) => { g.beginPath(); g.ellipse(cx + a * r, cy + b * r, r * 0.14, r * 0.1, 0, 0, 7); g.fill(); });
}
function draw() {
  if (kind === 'port') { scene(H * 0.62, 1.5, W / 2, 175); logo(W / 2, H * 0.2, 1.45); }
  else if (kind === 'land') { scene(H * 0.66, 1.6, W / 2, 200); logo(W / 2, H * 0.2, 1.3); }
  else if (kind === 'card') { scene(H * 0.62, 0.78, W / 2, 92); logo(W / 2, H * 0.83, 0.62); }
  else if (kind === 'shop') { scene(H * 0.82, 0.4, W / 2, 46); }
  else if (kind === 'slow') { turtle(W / 2, H * 0.58, W * 0.42); }
  document.title = 'done';
}
const wait = () => (CharV2.ready('eunyu3') && CharV2.ready('eungyeol3') ? document.fonts.load('40px Jua').then(draw) : setTimeout(wait, 50));
wait();
</script></body></html>
