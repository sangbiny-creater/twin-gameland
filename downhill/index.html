<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="은유와 은결">
<meta name="theme-color" content="#5CA9E6">
<meta name="application-name" content="은유와 은결">
<title>은유와 은결</title>
<link rel="manifest" href="../hub/manifest.json?v=202610311044">
<link rel="apple-touch-icon" href="../hub/icons/icon-180.png?v=202610311044">
<link rel="icon" type="image/png" sizes="32x32" href="../hub/icons/favicon-32.png?v=202610311044">
<link rel="icon" type="image/png" sizes="16x16" href="../hub/icons/favicon-16.png?v=202610311044">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/icons/favicon-192.png?v=202610311044">
<link rel="shortcut icon" href="../favicon.ico?v=202610311044">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202610311044">
</head>
<body>
<div id="safe"></div>
<div id="root">
  <canvas id="game"></canvas>

  <!-- 터치 영역: 화면 왼쪽 = 왼쪽으로, 오른쪽 = 오른쪽으로 -->
  <div id="touch" class="hidden">
    <div id="padL" class="pad"><img src="assets/ui/btn_left.webp?v=202610311044" alt=""></div>
    <div id="padR" class="pad"><img src="assets/ui/btn_right.webp?v=202610311044" alt=""></div>
    <button id="btnJump" class="jump hidden" aria-label="점프하기"><i id="jumpN">0</i><span>점프</span></button>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="btnPause" class="img-btn" aria-label="일시정지"><img data-icon="pause" alt=""></button>
      <div class="pill dist"><span class="ico ico-crown"></span><b id="hudDist">0</b>m</div>
      <div class="pill coins"><img data-icon="coin" alt=""><b id="hudCoin">0</b></div>
      <div id="hudHearts" class="hearts"></div>
    </div>
    <div class="hud-sub">
      <div class="best">BEST <b id="hudBest">0</b>m</div>
      <div id="buffs" class="buffs"></div>
    </div>
  </div>

  <!-- HOME (단독 실행일 때) -->
  <div id="home" class="screen">
    <div class="home-art"><img src="assets/ui/keyart.webp" alt="은유와 은결의 다운힐 러너"></div>
    <div class="label">누구랑 내려갈까?</div>
    <div class="chars">
      <button class="char" data-char="eunyu"><img data-icon="eunyu_idle" alt=""><span>은유</span></button>
      <button class="char" data-char="eungyeol"><img data-icon="eungyeol_idle" alt=""><span>은결</span></button>
    </div>
    <button id="btnStart" class="btn-start">TAP TO START</button>
    <div class="home-row">
      <div class="home-stats"><img data-icon="coin" alt=""><b id="totalCoin">0</b> · BEST <b id="bestAll">0</b>m</div>
      <button id="btnSound" class="round" aria-label="소리"><span class="ico-sound"></span></button>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen dim hidden">
    <div class="panel">
      <div class="p-title">잠깐 쉬어요</div>
      <button id="btnResume" class="btn-start small">계속하기</button>
      <div class="row">
        <button id="btnRetryP" class="btn-sub">다시하기</button>
        <button id="btnHomeP" class="btn-sub">게임 선택</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen dim hidden">
    <div class="panel wood">
      <div class="p-title">GAME OVER</div>
      <img id="resFace" class="res-face" alt="">
      <div class="res-table">
        <div><span>이동 거리</span><b><i id="resDist">0</i>m</b></div>
        <div><span>획득 코인</span><b><img data-icon="coin" alt=""><i id="resCoin">0</i></b></div>
        <div><span>최대 콤보</span><b><img data-icon="star" alt=""><i id="resCombo">0</i></b></div>
        <div><span>BEST 기록</span><b><span class="ico ico-crown"></span><i id="resBestVal">0</i>m</b></div>
      </div>
      <i id="resBest" class="badge hidden">NEW RECORD!</i>
      <div id="resEarn" class="earn hidden"></div>
      <button id="btnRetry" class="btn-orange">다시하기</button>
      <button id="btnHomeR" class="btn-blue">게임 선택</button>
    </div>
  </div>
</div>
<script src="../common/chars/looks.js?v=202610311044"></script>
<script src="../common/profile.js?v=202610311044"></script>
<script src="../common/charv2.js?v=202610311044"></script>
<script src="../common/costume.js?v=202610311044"></script>
<script src="../common/skins.js?v=202610311044"></script>
<script src="game.js?v=202610311044"></script>
</body>
</html>
