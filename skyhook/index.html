<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sky Hook">
<meta name="theme-color" content="#5CA9E6">
<title>Sky Hook Runner</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261023j">
</head>
<body>
<div id="safe"></div>
<div id="root">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="pill"><span class="ico ico-dist"></span><b id="hudDist">0</b>m</div>
      <div class="pill"><span class="ico ico-coin"></span><b id="hudCoin">0</b></div>
    </div>
    <div class="hud-mid"><div class="prog"><div id="hudProg"></div><span id="hudProgFace"></span></div></div>
    <div class="hud-right">
      <div id="hudHearts" class="hearts"></div>
      <button id="btnPause" class="round" aria-label="일시정지"><span class="ico ico-pause"></span></button>
    </div>
  </div>

  <!-- HOME -->
  <div id="home" class="screen">
    <div class="home-art"><img src="assets/keyart.jpg" alt="Sky Hook Runner"></div>
    <div class="home-panel">
      <div class="label">누구랑 달릴까?</div>
      <div class="chars">
        <button class="char" data-char="eunyu"><img src="assets/eunyu_base.jpg" alt=""><span>은유</span></button>
        <button class="char" data-char="eungyeol"><img src="assets/eungyeol_base.jpg" alt=""><span>은결</span></button>
      </div>
      <button id="btnStart" class="btn-start">START</button>
      <div class="home-row">
        <button id="btnStages" class="btn-sub">스테이지</button>
        <button id="btnSound" class="round" aria-label="소리"><span class="ico ico-sound"></span></button>
      </div>
      <div class="home-stats"><span class="ico ico-coin"></span><b id="totalCoin">0</b> · 최고 <b id="bestAll">0</b>m</div>
    </div>
    <div class="howto">탭/스페이스 = 점프 · 공중에서 꾹 누르기 = 훅! · 손 떼면 슝~</div>
  </div>

  <!-- STAGE SELECT -->
  <div id="stages" class="screen hidden">
    <div class="title">스테이지 선택</div>
    <div id="stageList" class="stage-list"></div>
    <button id="btnStagesBack" class="btn-sub">뒤로</button>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen dim hidden">
    <div class="panel">
      <div class="title">잠깐 쉬어요</div>
      <button id="btnResume" class="btn-start small">계속하기</button>
      <div class="home-row">
        <button id="btnRetryP" class="btn-sub">다시하기</button>
        <button id="btnHomeP" class="btn-sub">홈으로</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen dim hidden">
    <div class="panel result rpanel">
      <div class="r-head">
        <span class="spark l">✦</span><div id="resTitle" class="r-title">STAGE CLEAR!</div><span class="spark r">✦</span>
        <div id="resLabel" class="r-label">1-1</div>
      </div>
      <div class="r-body">
        <div class="r-face"><img id="resFace" src="assets/eunyu_happy.jpg" alt=""></div>
        <div class="r-stats">
          <div><span class="ri ri-dist"></span>거리 <b id="resDist">0</b>m <i id="resBest" class="badge hidden">NEW BEST!</i></div>
          <div><span class="ri ri-coin"></span>코인 <b id="resCoin">0</b></div>
          <div><span class="ri ri-star"></span>별 <span id="resStar" class="r-stars"></span></div>
          <div class="sub">최고 기록 <b id="resBestVal">0</b>m</div>
        </div>
      </div>
      <div id="resEarn" class="r-earn hidden"></div>
      <div class="r-btns">
        <button id="btnRetry" class="rb white">다시하기</button>
        <button id="btnNext" class="rb gold">다음 스테이지</button>
        <button id="btnHomeR" class="rb white">홈으로</button>
      </div>
    </div>
  </div>

  <!-- READY (메인 화면에서 들어왔을 때) -->
  <div id="ready" class="screen hidden">
    <div class="panel">
      <img id="readyFace" class="ready-face" src="assets/eunyu_base.jpg" alt="">
      <div id="readyTitle" class="title">1-1 하늘도시 1</div>
      <div class="ready-tip">탭/스페이스 = 점프 · 공중에서 꾹 = 훅 · 손 떼면 슝~</div>
      <div class="home-row">
        <button id="btnReadyMap" class="btn-sub">지도로</button>
        <button id="btnGo" class="btn-start small">출발!</button>
      </div>
    </div>
  </div>

  <div id="rotateHint" class="hidden">가로로 돌리면 더 크게 볼 수 있어요 ↻</div>
</div>
<script src="../common/profile.js?v=20261023j"></script>
<script src="../common/costume.js?v=20261023j"></script>
<script src="../common/skins.js?v=20261023j"></script>
<script src="game.js?v=20261023j"></script>
</body>
</html>
