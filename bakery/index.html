<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="은유와 은결">
<meta name="theme-color" content="#FF8FAE">
<meta name="application-name" content="은유와 은결">
<title>은유와 은결</title>
<link rel="manifest" href="../hub/manifest.json?v=202610311940">
<link rel="apple-touch-icon" href="../hub/icons/icon-180.png?v=202610311940">
<link rel="icon" type="image/png" sizes="32x32" href="../hub/icons/favicon-32.png?v=202610311940">
<link rel="icon" type="image/png" sizes="16x16" href="../hub/icons/favicon-16.png?v=202610311940">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/icons/favicon-192.png?v=202610311940">
<link rel="shortcut icon" href="../favicon.ico?v=202610311940">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202610311940">
<link rel="stylesheet" href="../common/pause.css?v=202610311940">
<link rel="stylesheet" href="../common/popup.css?v=202610311940">
<!-- 그림이 다 오기 전에는 화면을 가려 둠: 꾸밈 없는 창·글자가 잠깐 스쳐 보이지 않게 (QA 15). 늦으면 6초 뒤에는 그냥 보여 줌 -->
<style>html.booting body > *{visibility:hidden!important}</style>
<script>(function(){var d=document.documentElement;d.classList.add('booting');var on=function(){d.classList.remove('booting')};addEventListener('load',on);setTimeout(on,6000)})();</script>
</head>
<body>
<div id="safe"></div>
<div id="root">
  <canvas id="cv"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="btnPause" class="sq" aria-label="일시정지">⏸</button>
      <div class="pill hearts" id="hudHearts"></div>
      <div class="pill score"><b id="hudScore">0</b><small>점</small></div>
      <div class="pill level">레벨 <b id="hudLevel">1</b></div>
    </div>
    <div class="hud-sub">
      <div class="best">BEST <b id="hudBest">0</b></div>
      <div class="pill combo" id="comboPill">콤보 <b id="hudCombo">0</b></div>
      <div class="pill coins"><img src="../common/ui/coin.webp" alt=""><b id="hudCoin">0</b></div>
      <div id="buffs" class="buffs"></div>
    </div>
    <div id="memo" class="memo hidden"><b id="memoT">준비!</b><span id="memoN">3</span></div>
  </div>

  <!-- READY -->
  <div id="ready" class="screen hidden">
    <div class="panel">
      <img class="logo" src="assets/ui/logo.webp?v=202610311940" alt="은유와 은결의 달콤 베이커리">
      <div class="p-text">빵이 <b>노란 자리</b>에 오면 화면을 <b>톡!</b><br>긴 빵은 <b>꾹~</b> 누르고 있다가 끝에서 떼요<br><b>Bad</b>(놓침·함정)면 하트 -1 · 하트 2개로 시작, 다 없어지면 끝!<br>긴 빵 위 하트는 <b>시작·끝 모두 Perfect</b>면 +1 (최대 3개)</div>
      <div class="legend" id="legend"></div>
      <div class="p-sub" id="readyInfo">BEST 0점</div>
      <div class="row">
        <button id="btnReadyHome" class="btn white">게임 선택</button>
        <button id="btnGo" class="btn gold">출발!</button>
      </div>
    </div>
  </div>

  <!-- 어디서부터 할까요? (전에 레벨 2 이상까지 갔을 때) -->
  <div id="choose" class="screen dim hidden">
    <div class="panel">
      <div class="p-title">어디서부터 할까요?</div>
      <button id="btnFromLv" class="btn gold big">레벨 5부터 시작하기</button>
      <button id="btnFromStart" class="btn white">처음부터 하기</button>
      <button id="btnChooseBack" class="link">← 뒤로</button>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen dim hidden">
    <div class="panel">
      <div class="p-title">잠깐 쉬어요</div>
      <button id="btnResume" class="btn-start small">계속하기</button>
      <div class="row">
        <button id="btnRetryP" class="btn-sub">다시하기</button>
        <button id="btnHomeP" class="btn-sub">게임 선택</button>
      </div>
      <div class="ver" id="verTxt"></div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen dim hidden">
    <div class="panel result">
      <div class="r-title">오늘의 베이커리 끝!</div>
      <div class="r-score"><b id="resScore">0</b><small>점</small><i id="resBest" class="badge hidden">NEW RECORD!</i></div>
      <div class="shelf" id="resShelf"></div>
      <div class="r-box">
        <div><span>🧁 만든 케이크</span><b id="resMade">0</b></div>
        <div><span>✨ 완벽</span><b id="resPerfect">0</b></div>
        <div><span>🚀 도착한 레벨</span><b id="resLevel">1</b></div>
        <div><span>🔥 최대 콤보</span><b id="resCombo">0</b></div>
        <div><span>🪙 획득 코인</span><b id="resCoin">0</b></div>
        <div><span>👑 BEST 기록</span><b id="resBestVal">0</b></div>
      </div>
      <div id="resEarn" class="earn hidden"></div>
      <div class="r-acts">
        <button id="btnRetry" class="btn gold big">다시하기</button>
        <button id="btnHomeR" class="btn white">게임 선택</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>
<script src="../common/chars/looks.js?v=202610311940"></script>
<script src="../common/profile.js?v=202610311940"></script>
<script src="../common/charv2.js?v=202610311940"></script>
<script src="art.js?v=202610311940"></script>
<script src="levels.js?v=202610311940"></script>
<script src="game.js?v=202610311940"></script>
</body>
</html>
