<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="은유와 은결">
<meta name="theme-color" content="#FF8FAE">
<meta name="application-name" content="은유와 은결">
<title>은유와 은결</title>
<link rel="manifest" href="../hub/manifest.json?v=202610252005">
<link rel="apple-touch-icon" href="../hub/icons/icon-180.png?v=202610252005">
<link rel="icon" type="image/png" sizes="32x32" href="../hub/icons/favicon-32.png?v=202610252005">
<link rel="icon" type="image/png" sizes="16x16" href="../hub/icons/favicon-16.png?v=202610252005">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/icons/favicon-192.png?v=202610252005">
<link rel="shortcut icon" href="../favicon.ico?v=202610252005">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202610252005">
</head>
<body>
<div id="safe"></div>
<div id="root">
  <canvas id="cv"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="btnPause" class="sq" aria-label="일시정지">⏸</button>
      <div class="pill hearts" id="hudHearts"></div>
      <div class="starbar"><div id="starFill"></div><span class="s s1">★</span><span class="s s2">★</span><span class="s s3">★</span></div>
      <div class="stage-lbl" id="hudStage">스테이지 1-1</div>
    </div>
    <div class="hud-sub">
      <div class="pill score"><b id="hudScore">0</b><small>점</small></div>
      <div class="pill combo" id="comboPill">콤보 <b id="hudCombo">0</b></div>
      <div class="pill coins"><img src="../common/ui/coin.webp" alt=""><b id="hudCoin">0</b></div>
      <div id="buffs" class="buffs"></div>
    </div>
    <div class="items">
      <button id="it_life" class="item"><img src="../common/items/life.webp?v=202610252005" alt=""><i>1</i><span>하트 +1</span></button>
      <button id="it_slow" class="item"><img src="../common/items/slow.webp?v=202610252005" alt=""><i>1</i><span>느리게</span></button>
      <button id="it_auto" class="item"><img src="../common/items/auto.webp?v=202610252005" alt=""><i>1</i><span>자동 짜기</span></button>
    </div>
    <div id="memo" class="memo hidden"><b id="memoT">준비!</b><span id="memoN">3</span></div>
  </div>

  <!-- READY -->
  <div id="ready" class="screen hidden">
    <div class="panel">
      <div class="logo-txt"><small>은유와 은결의</small>달콤 베이커리</div>
      <div class="p-title" id="readyTitle">1-1 하늘도시 1</div>
      <div class="p-text">빵이 <b>노란 자리</b>에 오면 화면을 <b>톡!</b><br>긴 빵은 <b>꾹~</b> 누르고 있다가 끝에서 떼요</div>
      <div class="legend" id="legend"></div>
      <div class="p-sub" id="readyInfo">빵 14개 · 하트 3개</div>
      <div class="row">
        <button id="btnReadyMap" class="btn white">지도로</button>
        <button id="btnGo" class="btn gold">출발!</button>
      </div>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen dim hidden">
    <div class="panel">
      <div class="p-title">잠깐 쉬어요</div>
      <button id="btnResume" class="btn gold">계속하기</button>
      <div class="row">
        <button id="btnRetryP" class="btn white">다시하기</button>
        <button id="btnMapP" class="btn white">지도로</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen dim hidden">
    <div class="panel result">
      <div class="r-title" id="resTitle">스테이지 클리어!</div>
      <div class="r-stars" id="resStars"><span>★</span><span>★</span><span>★</span></div>
      <div class="shelf" id="resShelf"></div>
      <div class="r-box">
        <div><span>🧁 만든 케이크</span><b id="resMade">0</b></div>
        <div><span>✨ 완벽</span><b id="resPerfect">0</b></div>
        <div><span>🎯 정확도</span><b id="resAcc">0</b></div>
        <div><span>⭐ 점수</span><b id="resScore">0</b></div>
        <div><span>🔥 최대 콤보</span><b id="resCombo">0</b></div>
        <div><span>🪙 획득 코인</span><b id="resCoin">0</b></div>
      </div>
      <div id="resEarn" class="earn hidden"></div>
      <div class="r-acts">
        <button id="btnNext" class="btn gold big">다음 스테이지</button>
        <div class="row" id="resRow">
          <button id="btnRetry" class="btn blue">다시하기</button>
          <button id="btnMapR" class="btn white">지도로</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>
<script src="../common/chars/looks.js?v=202610252005"></script>
<script src="../common/profile.js?v=202610252005"></script>
<script src="../common/charv2.js?v=202610252005"></script>
<script src="art.js?v=202610252005"></script>
<script src="levels.js?v=202610252005"></script>
<script src="game.js?v=202610252005"></script>
</body>
</html>
