<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="은유와 은결">
<meta name="theme-color" content="#5CA9E6">
<meta name="application-name" content="은유와 은결">
<title>은유와 은결</title>
<link rel="manifest" href="../hub/manifest.json?v=202611092159">
<link rel="apple-touch-icon" href="../hub/icons/icon-180.png?v=202611092159">
<link rel="icon" type="image/png" sizes="32x32" href="../hub/icons/favicon-32.png?v=202611092159">
<link rel="icon" type="image/png" sizes="16x16" href="../hub/icons/favicon-16.png?v=202611092159">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/icons/favicon-192.png?v=202611092159">
<link rel="shortcut icon" href="../favicon.ico?v=202611092159">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202611092159">
<link rel="stylesheet" href="../common/pause.css?v=202611092159">
<link rel="stylesheet" href="../common/popup.css?v=202611092159">
<!-- 그림이 다 오기 전에는 화면을 가려 둠: 꾸밈 없는 창·글자가 잠깐 스쳐 보이지 않게 (QA 15). 늦으면 6초 뒤에는 그냥 보여 줌 -->
<style>html.booting body > *{visibility:hidden!important}</style>
<script>(function(){var d=document.documentElement;d.classList.add('booting');var on=function(){d.classList.remove('booting')};addEventListener('load',on);setTimeout(on,6000)})();</script>
</head>
<body>
<div id="safe"></div>
<div id="root">
  <canvas id="cv"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="btnPause" class="sq" aria-label="일시정지">⏸</button>
      <div class="stage-lbl" id="hudStage">스테이지 1-1</div>
      <div class="pill hearts" id="hudHearts"></div>
      <div class="pill guests"><span>손님</span> <b id="hudGuests">0 / 0</b></div>
      <div class="pill coins"><img src="../common/ui/coin.webp" alt=""><b id="hudCoin">0</b></div>
    </div>
  </div>

  <!-- READY -->
  <div id="ready" class="screen hidden">
    <div class="panel">
      <img class="logo" src="assets/ui/logo.webp?v=202611092159" alt="버거 러시">
      <div class="p-title" id="readyTitle">1-1 햄버거 골목 1</div>
      <div class="p-text">손님 주문대로 버거를 쌓아 내줘요! 손님이 화나서 떠나면 하트 -1</div>
      <div class="p-sub" id="readyInfo">손님 4명</div>
      <div class="row">
        <button id="btnGo" class="btn gold">시작하기</button>
        <button id="btnReadyHome" class="btn white">메인으로</button>
        <button id="btnReadyMap" class="btn white hidden" aria-hidden="true">지도로</button>
      </div>
    </div>
  </div>

  <!-- 주문 보기 (손님 말풍선을 누르면) -->
  <div id="recipe" class="screen dim hidden">
    <div class="panel">
      <div class="p-title">주문 보기</div>
      <div class="rc-body"><div class="rc-list" id="rcList"></div><div class="rc-sides" id="rcSides"></div></div>
      <button id="btnRecipeClose" class="btn">닫기</button>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen dim hidden">
    <div class="panel">
      <div class="p-title">잠깐 쉬어요</div>
      <button id="btnResume" class="btn-start small">계속하기</button>
      <div class="row">
        <button id="btnRetryP" class="btn-sub">다시하기</button>
        <button id="btnMapP" class="btn-sub">지도 보기</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen dim hidden">
    <div class="panel result">
      <div class="r-title" id="resTitle">스테이지 클리어!</div>
      <div class="r-why hidden" id="resWhy"></div>
      <div class="r-stars" id="resStars"><span>★</span><span>★</span><span>★</span></div>
      <div class="r-box">
        <div><span>🍔 받은 손님</span><b id="resServed">0</b></div>
        <div><span>💢 화나서 간 손님</span><b id="resMissed">0</b></div>
        <div><span>🪙 획득 코인</span><b id="resCoin">0</b></div>
      </div>
      <div id="resEarn" class="earn hidden"></div>
      <div class="r-acts">
        <div class="row" id="resRow">
          <button id="btnRetry" class="btn">다시하기</button>
          <button id="btnNext" class="btn">다음 스테이지</button>
        </div>
        <div class="row">
          <button id="btnHomeR" class="btn">메인으로</button>
          <button id="btnMapR" class="btn">지도 보기</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>
<!-- 세로 화면: 게임은 완전히 멈추고 이 안내만 (가로 전용 게임) -->
<div id="rotate" class="hidden">
  <img src="assets/ui/rotate.webp?v=202611092159" alt="">
  <p>폰을 가로로 돌려 주세요</p>
</div>
<script src="../common/chars/looks.js?v=202611092159"></script>
<script src="../common/profile.js?v=202611092159"></script>
<script src="../common/i18n_data.js?v=202611092159"></script>
<script src="../common/i18n.js?v=202611092159"></script>
<script src="../common/gamepop.js?v=202611092159"></script>
<script src="levels.js?v=202611092159"></script>
<script src="game.js?v=202611092159"></script>
<script src="../common/popup.js?v=202611092159"></script>
</body>
</html>
