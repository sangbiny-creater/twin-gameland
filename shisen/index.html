<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="은유와 은결">
<meta name="theme-color" content="#3A2A5C">
<meta name="application-name" content="은유와 은결">
<title>은유와 은결</title>
<link rel="manifest" href="../hub/manifest.json?v=202610272345">
<link rel="apple-touch-icon" href="../hub/icons/icon-180.png?v=202610272345">
<link rel="icon" type="image/png" sizes="32x32" href="../hub/icons/favicon-32.png?v=202610272345">
<link rel="icon" type="image/png" sizes="16x16" href="../hub/icons/favicon-16.png?v=202610272345">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/icons/favicon-192.png?v=202610272345">
<link rel="shortcut icon" href="../favicon.ico?v=202610272345">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202610272345">
<link rel="stylesheet" href="../common/pause.css?v=202610272345">
</head>
<body>
<div id="safe"></div>
<div id="root">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="btnPause" class="sq" aria-label="일시정지">⏸</button>
      <div class="pill timer" id="timerPill"><img src="assets/ui/time.webp" alt=""><b id="hudTime">01:25</b></div>
      <div class="starbar"><div id="starFill"></div><span class="s s1">★</span><span class="s s2">★</span><span class="s s3">★</span></div>
      <div class="stage-lbl" id="hudStage">스테이지 1-1</div>
    </div>
    <div class="hud-sub">
      <div class="pill coins"><img src="../common/ui/coin.webp" alt=""><b id="hudCoin">0</b></div>
      <div class="pill left">남은 짝 <b id="hudLeft">0</b></div>
      <div id="buffs" class="buffs"></div>
    </div>
    <div class="items">
      <button id="btnHint" class="item"><img src="assets/ui/hint.webp" alt=""><i id="cHint">3</i><span>힌트</span></button>
      <button id="btnShuffle" class="item"><img src="assets/ui/shuffle.webp" alt=""><i id="cShuffle">2</i><span>섞기</span></button>
      <button id="btnTime" class="item"><img src="assets/ui/time.webp" alt=""><i id="cTime">1</i><span>시간 추가</span></button>
      <button id="btnBomb" class="item hidden"><img src="assets/ui/bomb.webp" alt=""><i id="cBomb">1</i><span>폭탄</span></button>
    </div>
  </div>

  <!-- READY -->
  <div id="ready" class="screen hidden">
    <div class="panel">
      <img class="logo" src="assets/ui/logo.webp?v=202610272345" alt="은유와 은결의 사천성">
      <div class="p-title" id="readyTitle">1-1 꽃 정원 1</div>
      <div class="p-text">같은 그림 2개를 선으로 이어요.<br>선은 <b>2번까지 꺾을 수 있고</b>, 다른 타일은 지나갈 수 없어요.</div>
      <div class="p-sub" id="readyInfo">타일 24개 · 제한 시간 2:30</div>
      <div class="row">
        <button id="btnReadyMap" class="btn white">지도로</button>
        <button id="btnGo" class="btn gold">출발!</button>
      </div>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen dim hidden">
    <div class="panel">
      <div class="p-title">잠깐 쉬어요</div>
      <button id="btnResume" class="btn-start small">계속하기</button>
      <div class="row">
        <button id="btnRetryP" class="btn-sub">다시하기</button>
        <button id="btnMapP" class="btn-sub">지도로</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen dim hidden">
    <div class="panel result">
      <div class="r-title" id="resTitle">스테이지 클리어!</div>
      <div class="r-stars" id="resStars"><span>★</span><span>★</span><span>★</span></div>
      <div class="r-box">
        <div><span>⏱ 클리어 시간</span><b id="resTime">01:12</b></div>
        <div><span>🔥 최대 콤보</span><b id="resCombo">0</b></div>
        <div><span>🪙 획득 코인</span><b id="resCoin">0</b></div>
      </div>
      <div id="resEarn" class="earn hidden"></div>
      <div class="r-acts">
        <button id="btnNext" class="btn gold big">다음 스테이지</button>
        <div class="row" id="resRow">
          <button id="btnRetry" class="btn blue">다시하기</button>
          <button id="btnMapR" class="btn white">지도로</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>
<script src="../common/chars/looks.js?v=202610272345"></script>
<script src="../common/profile.js?v=202610272345"></script>
<script src="../common/skins.js?v=202610272345"></script>
<script src="../common/charv2.js?v=202610272345"></script>
<script src="../common/costume.js?v=202610272345"></script>
<script src="levels.js?v=202610272345"></script>
<script src="game.js?v=202610272345"></script>
</body>
</html>
