<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="은유와 은결">
<meta name="theme-color" content="#5CA9E6">
<meta name="application-name" content="은유와 은결">
<title>은유와 은결</title>
<link rel="manifest" href="../hub/manifest.json?v=202610312145">
<link rel="apple-touch-icon" href="../hub/icons/icon-180.png?v=202610312145">
<link rel="icon" type="image/png" sizes="32x32" href="../hub/icons/favicon-32.png?v=202610312145">
<link rel="icon" type="image/png" sizes="16x16" href="../hub/icons/favicon-16.png?v=202610312145">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/icons/favicon-192.png?v=202610312145">
<link rel="shortcut icon" href="../favicon.ico?v=202610312145">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202610312145">
<link rel="stylesheet" href="../common/popup.css?v=202610312145">
<!-- 그림이 다 오기 전에는 화면을 가려 둠: 꾸밈 없는 창·글자가 잠깐 스쳐 보이지 않게 (QA 15). 늦으면 6초 뒤에는 그냥 보여 줌 -->
<style>html.booting body > *{visibility:hidden!important}</style>
<script>(function(){var d=document.documentElement;d.classList.add('booting');var on=function(){d.classList.remove('booting')};addEventListener('load',on);setTimeout(on,6000)})();</script>
</head>
<body>
<div id="safe"></div>
<div id="root">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-left">
      <button id="btnPause" class="img-btn" aria-label="일시정지"><img src="assets/ui/pause.webp" alt=""></button>
      <div class="pills">
        <div class="pill"><span class="ico ico-crown"></span><b id="hudDist">0</b>m</div>
        <div class="pill"><span class="ico ico-coin"></span><b id="hudCoin">0</b></div>
      </div>
    </div>
    <div class="hud-mid">
      <div class="prog"><div id="hudProg"></div><span id="hudProgFace"></span><span class="flag"></span></div>
      <div class="best-label">BEST <b id="hudBest">0</b>m</div>
    </div>
    <div class="hud-right"><div id="hudHearts" class="hearts"></div></div>
    <div id="buffs" class="buffs"></div>
  </div>

  <!-- HOME -->
  <div id="home" class="screen">
    <div class="home-art"><img src="assets/ui/keyart.webp" alt="Sky Rider"></div>
    <div class="home-panel">
      <div class="label">누가 별 구름을 탈까?</div>
      <div class="chars">
        <button class="char" data-char="eunyu"><img src="assets/chars/face_eunyu.webp" alt=""><span>은유</span></button>
        <button class="char" data-char="eungyeol"><img src="assets/chars/face_eungyeol.webp" alt=""><span>은결</span></button>
      </div>
      <button id="btnStart" class="btn-start">START</button>
      <div class="home-row">
        <div class="home-stats"><span class="ico ico-coin"></span><b id="totalCoin">0</b> · BEST <b id="bestAll">0</b>m</div>
        <button id="btnSound" class="round" aria-label="소리"><span class="ico ico-sound"></span></button>
      </div>
    </div>
    <div class="howto">꾹 누르면 위로 · 손 떼면 아래로 · 파이프를 피해 멀리 날아가요!</div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen dim hidden">
    <div class="panel">
      <div class="title">잠깐 쉬어요</div>
      <button id="btnResume" class="btn-start small">계속하기</button>
      <div class="home-row">
        <button id="btnRetryP" class="btn-sub">다시하기</button>
        <button id="btnHomeP" class="btn-sub">게임 선택</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen dim hidden">
    <div class="panel result">
      <div class="title">GAME OVER</div>
      <div class="res-body">
        <img id="resFace" src="assets/chars/face_eunyu.webp" alt="">
        <div class="res-stats">
          <div><span class="ico ico-crown"></span>거리 <b id="resDist">0</b>m <i id="resBest" class="badge hidden">NEW BEST!</i></div>
          <div><span class="ico ico-coin"></span>코인 <b id="resCoin">0</b></div>
          <div class="sub">최고 기록 <b id="resBestVal">0</b>m · 도착한 곳 <b id="resTheme">하늘도시</b></div>
        </div>
      </div>
      <div id="resEarn" class="earn hidden"></div>
      <div class="home-row">
        <button id="btnRetry" class="btn-start small">다시하기</button>
        <button id="btnHomeR" class="btn-sub">게임 선택</button>
      </div>
    </div>
  </div>

  <div id="rotateHint" class="hidden">가로로 돌리면 더 크게 볼 수 있어요 ↻</div>
</div>
<script src="../common/chars/looks.js?v=202610312145"></script>
<script src="../common/profile.js?v=202610312145"></script>
<script src="../common/charv2.js?v=202610312145"></script>
<script src="../common/costume.js?v=202610312145"></script>
<script src="../common/skins.js?v=202610312145"></script>
<script src="game.js?v=202610312145"></script>
<script src="../common/popup.js?v=202610312145"></script>
</body>
</html>
