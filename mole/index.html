<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="은유와 은결">
<meta name="theme-color" content="#5CA9E6">
<meta name="application-name" content="은유와 은결">
<title>은유와 은결</title>
<link rel="manifest" href="../hub/manifest.json?v=202611010049">
<link rel="apple-touch-icon" href="../hub/icons/icon-180.png?v=202611010049">
<link rel="icon" type="image/png" sizes="32x32" href="../hub/icons/favicon-32.png?v=202611010049">
<link rel="icon" type="image/png" sizes="16x16" href="../hub/icons/favicon-16.png?v=202611010049">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/icons/favicon-192.png?v=202611010049">
<link rel="shortcut icon" href="../favicon.ico?v=202611010049">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202611010049">
<link rel="stylesheet" href="../common/pause.css?v=202611010049">
<link rel="stylesheet" href="../common/popup.css?v=202611010049">
<!-- 그림이 다 오기 전에는 화면을 가려 둠: 꾸밈 없는 창·글자가 잠깐 스쳐 보이지 않게 (QA 15). 늦으면 6초 뒤에는 그냥 보여 줌 -->
<style>html.booting body > *{visibility:hidden!important}</style>
<script>(function(){var d=document.documentElement;d.classList.add('booting');var on=function(){d.classList.remove('booting')};addEventListener('load',on);setTimeout(on,6000)})();</script>
</head>
<body>
<div id="safe"></div>
<div id="root">
  <canvas id="cv"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="btnPause" class="sq" aria-label="일시정지">⏸</button>
      <div class="pill timer" id="timerPill"><img src="../common/items/time.webp?v=202611010049" alt=""><b id="hudTime">30초</b></div>
      <div class="starbar"><div id="starFill"></div><span class="s s1">★</span><span class="s s2">★</span><span class="s s3">★</span></div>
      <div class="stage-lbl" id="hudStage">스테이지 1-1</div>
    </div>
    <div class="hud-sub">
      <div class="pill hearts" id="hudHearts"></div>
      <div class="pill score"><b id="hudScore">0</b><small>/ <span id="hudGoal">0</span></small></div>
      <div class="pill combo" id="comboPill">콤보 <b id="hudCombo">0</b></div>
      <div class="pill coins"><img src="../common/ui/coin.webp" alt=""><b id="hudCoin">0</b></div>
      <div id="buffs" class="buffs"></div>
    </div>
    <div class="items">
      <button id="it_time" class="item"><img src="../common/items/time.webp?v=202611010049" alt=""><i>1</i><span>시간 +10초</span></button>
      <button id="it_double" class="item"><img src="../common/items/double.webp?v=202611010049" alt=""><i>1</i><span>점수 2배</span></button>
      <button id="it_rainbow" class="item"><img src="../common/items/rainbow.webp?v=202611010049" alt=""><i>1</i><span>무지개 망치</span></button>
    </div>
    <div id="memo" class="memo hidden"><b id="memoT">준비!</b><span id="memoN">3</span></div>
  </div>

  <!-- READY -->
  <div id="ready" class="screen hidden">
    <div class="panel">
      <img class="logo" src="assets/ui/logo.webp?v=202611010049" alt="은유와 은결의 두더지 게임">
      <div class="p-title" id="readyTitle">1-1 하늘도시 1</div>
      <div class="p-text">구멍에서 튀어나오는 두더지를 <b>톡톡</b> 쳐요! 시간이 끝날 때 <b>목표 점수</b>를 넘으면 클리어!<br>두더지를 <b>놓치거나</b> 은유·은결을 누르면 <b>하트 -1</b>, 하트가 다 없어지면 실패!</div>
      <div class="legend" id="legend"></div>
      <div class="p-sub" id="readyInfo">제한 시간 30초 · 목표 1,000점</div>
      <div class="row">
        <button id="btnReadyMap" class="btn white">지도로</button>
        <button id="btnGo" class="btn gold">출발!</button>
      </div>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen dim hidden">
    <div class="panel">
      <div class="p-title">잠깐 쉬어요</div>
      <button id="btnResume" class="btn-start small">계속하기</button>
      <div class="row">
        <button id="btnRetryP" class="btn-sub">다시하기</button>
        <button id="btnMapP" class="btn-sub">지도로</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen dim hidden">
    <div class="panel result">
      <div class="r-title" id="resTitle">스테이지 클리어!</div>
      <div class="r-why hidden" id="resWhy"></div>
      <div class="r-stars" id="resStars"><span>★</span><span>★</span><span>★</span></div>
      <div class="r-box">
        <div><span>⭐ 점수</span><b id="resScore">0</b></div>
        <div><span>🎯 목표 점수</span><b id="resGoal">0</b></div>
        <div><span>🔨 잡은 두더지</span><b id="resCaught">0</b></div>
        <div><span>🔥 최대 콤보</span><b id="resCombo">0</b></div>
        <div><span>🪙 획득 코인</span><b id="resCoin">0</b></div>
      </div>
      <div id="resEarn" class="earn hidden"></div>
      <div class="r-acts">
        <button id="btnNext" class="btn gold big">다음 스테이지</button>
        <div class="row" id="resRow">
          <button id="btnRetry" class="btn blue">다시하기</button>
          <button id="btnMapR" class="btn white">지도로</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>
<script src="../common/chars/looks.js?v=202611010049"></script>
<script src="../common/profile.js?v=202611010049"></script>
<script src="../common/skins.js?v=202611010049"></script>
<script src="levels.js?v=202611010049"></script>
<script src="game.js?v=202611010049"></script>
<script src="../common/popup.js?v=202611010049"></script>
</body>
</html>
