<!-- 그림이 다 오기 전에는 화면을 가려 둠: 꾸밈 없는 창·글자가 잠깐 스쳐 보이지 않게 (QA 15). 늦으면 6초 뒤에는 그냥 보여 줌 -->
<style>html.booting body > *{visibility:hidden!important}</style>
<script>(function(){var d=document.documentElement;d.classList.add('booting');var on=function(){d.classList.remove('booting')};addEventListener('load',on);setTimeout(on,6000)})();</script>

<body>
<div class="sh">
  <section class="sh-top">
    <img class="sh-art" src="assets/v4/top.webp?v=202611092159" alt="">
    <a class="sh-back" href="../index.html#lobby" aria-label="뒤로"><img src="../closet/assets/back.svg?v=202611092159" alt=""></a>
    <div class="sh-money">
      <div class="sh-pill"><img src="assets/ui/coin.webp?v=202611092159" alt=""><b id="myCoins">0</b></div>
      <button id="gemPill" class="sh-pill gem"><img src="../hub/park/ui/gem.webp?v=202611092159" alt=""><b id="myGems">0</b><i class="plus"></i></button>
    </div>
    <div id="topCards" class="sh-cards hidden">
      <div class="sh-card">
        <div class="sc-head"><img src="../common/ui/monet/ico_attend.webp?v=202611092159" alt=""><b>출석 보상</b></div>
        <p id="attDays"></p>
      </div>
      <button id="adCard" class="sh-card">
        <div class="sc-head"><img src="../common/ui/monet/ico_ad.webp?v=202611092159" alt=""><b>광고보기</b></div>
        <p id="adMsg"></p>
      </button>
    </div>
  </section>

  <nav class="sh-tabs">
    <button data-tab="deco"><img src="../closet/assets/hanger.webp?v=202611092159" alt=""><span>꾸미기</span></button>
    <button data-tab="item"><img src="assets/ui/coin.webp?v=202611092159" alt=""><span>아이템</span></button>
    <button data-tab="gem" id="tabGemBtn"><img src="../hub/park/ui/gem.webp?v=202611092159" alt=""><span>다이아 구매</span></button>
  </nav>

  <main class="sh-body">
    <section id="tab-deco" class="sh-tab">
      <section id="park" class="sec park hidden">
        <div class="sec-head"><b>놀이공원 꾸미기</b><span class="sec-desc">다이아로 사서 첫 화면을 꾸며요! 동상·분수·대문·이름표·로고</span></div>
        <div id="parkShop"></div>
      </section>
    </section>

    <section id="tab-item" class="sh-tab hidden">
      <div class="sec-head"><b>아이템</b><span class="sec-desc">한 번 사면 모든 게임에서 같이 써요!</span></div>
      <div id="boostGrid" class="bgrid"></div>
    </section>

    <section id="tab-gem" class="sh-tab hidden">
      <div id="gmPacks" class="gm-packs"></div>
      <div id="gmOffers" class="gm-offers"></div>
      <p class="gm-note">앱에서는 여기서 구글 결제 창이 떠요 (값은 임시). 지금은 진짜 결제가 없어요.</p>
    </section>

    <div class="coupon-wrap"><button id="btnCoupon" class="coupon-btn">쿠폰 입력하기</button></div>
  </main>
</div>

<!-- 쿠폰 -->
<div id="coupon" class="modal hidden">
  <div class="mpanel">
    <div class="m-title">쿠폰 입력하기</div>
    <div class="m-body">받은 쿠폰 번호를 입력해 주세요.</div>
    <input id="couponInput" class="coupon-input" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="쿠폰 번호">
    <div id="couponMsg" class="coupon-msg"></div>
    <div class="m-row">
      <button class="mbtn gray" id="couponCancel">닫기</button>
      <button class="mbtn gold" id="couponOk">입력</button>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="mpanel">
    <div class="m-title" id="mTitle"></div>
    <div class="m-body" id="mBody"></div>
    <div class="m-row">
      <button class="mbtn gray" id="mCancel">취소</button>
      <button class="mbtn gold" id="mOk">구매</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
