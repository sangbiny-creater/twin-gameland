<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1E3A78">
<meta name="apple-mobile-web-app-title" content="은유와 은결">
<meta name="application-name" content="은유와 은결">
<title>은유와 은결</title>
<link rel="manifest" href="../hub/manifest.json?v=202611121837">
<link rel="apple-touch-icon" href="../hub/icons/icon-180.png?v=202611121837">
<link rel="icon" type="image/png" sizes="32x32" href="../hub/icons/favicon-32.png?v=202611121837">
<link rel="icon" type="image/png" sizes="16x16" href="../hub/icons/favicon-16.png?v=202611121837">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/icons/favicon-192.png?v=202611121837">
<link rel="shortcut icon" href="../favicon.ico?v=202611121837">
<link rel="preload" href="../common/fonts/jua.woff2?v=202611121837" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="shop.css?v=202611121837">
<link rel="stylesheet" href="../common/popup.css?v=202611121837">
<!-- 화면을 한 번에 보여 주기: 그림·글꼴이 다 준비될 때까지 가려 두고 한꺼번에 (common/boot.js) -->
<script src="../common/boot.js?v=202611121837"></script>
</head>
<body>
<div class="sh">
  <section class="sh-top">
    <img class="sh-art" src="assets/v4/top.webp?v=202611121837" alt="">
    <a class="sh-back" href="../index.html#lobby" aria-label="뒤로"><img src="../closet/assets/back.svg?v=202611121837" alt=""></a>
    <div class="sh-money">
      <div class="sh-pill"><img src="assets/ui/coin.webp?v=202611121837" alt=""><b id="myCoins">0</b></div>
      <button id="gemPill" class="sh-pill gem"><img src="../hub/park/ui/gem.webp?v=202611121837" alt=""><b id="myGems">0</b><i class="plus"></i></button>
    </div>
    <div id="topCards" class="sh-cards hidden">
      <!-- 출석·광고 버튼판: 은유 = 출석 분홍·광고 파랑, 은결 = 둘 다 파랑. 판 그림(아이콘·화살표 포함, shop/assets/ui/card_*.webp) 위에 제목·작은 칸 글자만 코드로 씀 -->
      <button id="attCard" class="sh-card att">
        <b class="sc-t">출석 보상</b><p id="attDays" class="sc-pill"></p>
      </button>
      <button id="adCard" class="sh-card ad">
        <b class="sc-t">광고보기</b><p id="adMsg" class="sc-pill"></p>
      </button>
    </div>
  </section>

  <nav class="sh-tabs">
    <button data-tab="deco"><img src="assets/ui/tab_deco.webp?v=202611121837" alt=""><span>꾸미기</span></button>
    <button data-tab="item"><img src="assets/ui/coin.webp?v=202611121837" alt=""><span>아이템</span></button>
    <button data-tab="gem" id="tabGemBtn"><img src="../hub/park/ui/gem.webp?v=202611121837" alt=""><span>다이아 구매</span></button>
  </nav>

  <main class="sh-body">
    <section id="tab-deco" class="sh-tab">
      <section id="park" class="sec park hidden">
        <div class="sec-head"><b>놀이공원 꾸미기</b><span class="sec-desc">다이아로 사서 첫 화면을 꾸며요! 동상·분수·대문·이름표·로고</span></div>
        <div id="parkShop"></div>
      </section>
    </section>

    <section id="tab-item" class="sh-tab hidden">
      <div class="sec-head"><b>아이템</b><span class="sec-desc">한 번 사면 모든 게임에서 같이 써요!</span></div>
      <div id="boostGrid" class="bgrid"></div>
    </section>

    <section id="tab-gem" class="sh-tab hidden">
      <div id="gmPacks" class="gm-packs"></div>
      <div id="gmOffers" class="gm-offers"></div>
      <p class="gm-note">앱에서는 여기서 구글 결제 창이 떠요 (값은 임시). 지금은 진짜 결제가 없어요.</p>
    </section>

    <div class="coupon-wrap"><button id="btnCoupon" class="coupon-btn">쿠폰 입력하기</button></div>
  </main>
</div>

<!-- 쿠폰 -->
<div id="coupon" class="modal hidden">
  <div class="mpanel">
    <div class="m-title">쿠폰 입력하기</div>
    <div class="m-body">받은 쿠폰 번호를 입력해 주세요.</div>
    <input id="couponInput" class="coupon-input" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="쿠폰 번호">
    <div id="couponMsg" class="coupon-msg"></div>
    <div class="m-row">
      <button class="mbtn gray" id="couponCancel">닫기</button>
      <button class="mbtn gold" id="couponOk">입력</button>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="mpanel">
    <div class="m-title" id="mTitle"></div>
    <div class="m-body" id="mBody"></div>
    <div class="m-row">
      <button class="mbtn gray" id="mCancel">취소</button>
      <button class="mbtn gold" id="mOk">구매</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="../common/chars/looks.js?v=202611121837"></script>
<script src="../common/profile.js?v=202611121837"></script>
<script src="../common/i18n_data.js?v=202611121837"></script>
<script src="../common/i18n.js?v=202611121837"></script>
<script src="../common/ui.js?v=202611121837"></script>
<script src="shop.js?v=202611121837"></script>
<script src="../common/popup.js?v=202611121837"></script>
</body>
</html>
