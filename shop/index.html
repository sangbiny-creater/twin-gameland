<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E3A78">
<title>아이템 샵 · 트윈 게임랜드</title>
<link rel="manifest" href="../hub/manifest.json">
<link rel="apple-touch-icon" href="../hub/icon-180.png">
<link rel="icon" href="../hub/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css?v=20261022y">
</head>
<body>
<header class="topbar">
  <a class="brand" href="../index.html#lobby"><span class="home">🏠</span><span>트윈 게임랜드</span></a>
  <div class="me">
    <div class="coin-pill"><img src="assets/v2/coin.png?v=20261022y" alt=""><b id="myCoins">0</b></div>
    <img id="myFace" class="face" alt="">
  </div>
</header>

<div class="layout">
  <!-- PC: 왼쪽 메뉴 -->
  <aside class="side">
    <button class="stab on" data-sec="skins"><i>🖼️</i>배경 스킨</button>
    <button class="stab" data-sec="boosts"><i>🚀</i>게임 부스트</button>
    <button class="stab" data-sec="owned"><i>🎒</i>보유 아이템</button>
    <div class="side-line"></div>
    <button class="help" data-help aria-label="아이템 샵 이용 안내">?</button>
  </aside>

  <main>
    <section class="banner">
      <img src="assets/v2/banner.jpg?v=20261022y" alt="아이템 샵 — 게임을 더 재미있게! 나만의 스타일로 꾸며보세요!">
    </section>

    <section class="games-wrap">
      <div id="games" class="games"></div>
      <button class="row-arrow" data-scroll="games" aria-label="더 보기">›</button>
    </section>

    <!-- 폰: 가로 탭 -->
    <nav class="mtabs">
      <button class="mtab on" data-sec="skins"><i>🖼️</i>배경 스킨</button>
      <button class="mtab" data-sec="boosts"><i>🚀</i>게임 부스트</button>
      <button class="mtab" data-sec="owned"><i>🎒</i>보유 아이템</button>
      <button class="help" data-help aria-label="아이템 샵 이용 안내">?</button>
    </nav>

    <section id="sec-skins" class="sec skins">
      <div class="sec-head"><span class="sec-ico">🖼️</span><b>배경 스킨</b><span class="sec-desc">게임의 배경을 더 예쁘게 꾸며보세요!</span></div>
      <div class="row-wrap">
        <div id="skinRow" class="skin-row"></div>
        <button class="row-arrow" data-scroll="skinRow" aria-label="더 보기">›</button>
      </div>
    </section>

    <div class="split">
      <section id="sec-boosts" class="sec boosts">
        <div class="sec-head"><span class="sec-ico">🚀</span><b>게임 부스트</b><span class="sec-desc">게임을 더 쉽게! 다양한 부스트 아이템을 사용해보세요!</span></div>
        <div id="boostGrid" class="bgrid"></div>
      </section>
      <section id="sec-owned" class="sec owned">
        <div class="sec-head"><span class="sec-ico">🎒</span><b>보유 아이템</b><span class="sec-desc">이미 보유하고 있는 아이템이에요!</span></div>
        <div id="ownedGrid" class="bgrid"></div>
      </section>
    </div>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="mpanel">
    <div class="m-title" id="mTitle"></div>
    <div class="m-body" id="mBody"></div>
    <div class="m-row">
      <button class="mbtn gray" id="mCancel">취소</button>
      <button class="mbtn gold" id="mOk">구매</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="../common/profile.js?v=20261022y"></script>
<script src="shop.js?v=20261022y"></script>
</body>
</html>
