<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E3A78">
<meta name="apple-mobile-web-app-title" content="은유와 은결">
<meta name="application-name" content="은유와 은결">
<title>은유와 은결</title>
<link rel="manifest" href="../hub/manifest.json?v=202611010110">
<link rel="apple-touch-icon" href="../hub/icons/icon-180.png?v=202611010110">
<link rel="icon" type="image/png" sizes="32x32" href="../hub/icons/favicon-32.png?v=202611010110">
<link rel="icon" type="image/png" sizes="16x16" href="../hub/icons/favicon-16.png?v=202611010110">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/icons/favicon-192.png?v=202611010110">
<link rel="shortcut icon" href="../favicon.ico?v=202611010110">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css?v=202611010110">
<link rel="stylesheet" href="../common/popup.css?v=202611010110">
<!-- 그림이 다 오기 전에는 화면을 가려 둠: 꾸밈 없는 창·글자가 잠깐 스쳐 보이지 않게 (QA 15). 늦으면 6초 뒤에는 그냥 보여 줌 -->
<style>html.booting body > *{visibility:hidden!important}</style>
<script>(function(){var d=document.documentElement;d.classList.add('booting');var on=function(){d.classList.remove('booting')};addEventListener('load',on);setTimeout(on,6000)})();</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="../index.html#lobby"><img class="home" src="assets/ui/home.webp?v=202611010110" alt=""><span>트윈 게임랜드</span></a>
  <div class="me">
    <div class="coin-pill"><img src="assets/ui/coin.webp?v=202611010110" alt=""><b id="myCoins">0</b></div>
    <div id="gemPill" class="coin-pill hidden"><img src="../hub/park/ui/gem.webp?v=202611010110" alt=""><b id="myGems">0</b></div>
    <img id="myFace" class="face" alt="">
  </div>
</header>

<div class="layout">
  <main>
    <section class="banner">
      <img src="assets/ui/banner.webp?v=202611010110" alt="아이템 샵 — 게임을 더 재미있게! 나만의 스타일로 꾸며보세요!">
    </section>

    <!-- 캐릭터 꾸미기 입구 -->
    <section class="dress-entry">
      <button id="btnDress" class="dress-btn">
        <span class="dress-faces"><img id="dressFace1" alt=""><img id="dressFace2" alt=""></span>
        <b>캐릭터 꾸미기</b><span class="new">NEW</span><span class="arr">›</span>
      </button>
      <div id="dressStrip" class="dress-strip"></div>
    </section>

    <!-- 배경 스킨: 모든 게임 공통 -->
    <section id="sec-skins" class="sec skins">
      <div class="sec-head"><span class="sec-ico">🖼️</span><b>배경 스킨</b><span class="sec-desc">한 번 사면 모든 게임 배경이 함께 바뀌어요!</span></div>
      <div class="row-wrap">
        <div id="skinRow" class="skin-row"></div>
        <button class="row-arrow" data-scroll="skinRow" aria-label="더 보기">›</button>
      </div>
    </section>

    <!-- 게임 선택: 스크롤해도 위에 고정, 아래 부스트·보유 아이템에만 적용 -->
    <section class="games-wrap">
      <div class="games-lbl">🎮 게임을 골라 부스트를 사세요</div>
      <div class="games-row">
        <div id="games" class="games"></div>
        <button class="row-arrow" data-scroll="games" aria-label="더 보기">›</button>
      </div>
    </section>

    <div class="split">
      <section id="sec-boosts" class="sec boosts">
        <div class="sec-head"><span class="sec-ico">🚀</span><b>게임 부스트</b><span class="sec-desc">게임을 더 쉽게! 다양한 부스트 아이템을 사용해보세요!</span></div>
        <div id="boostGrid" class="bgrid"></div>
      </section>
      <section id="sec-owned" class="sec owned">
        <div class="sec-head"><span class="sec-ico">🎒</span><b>보유 아이템</b><span class="sec-desc">이미 보유하고 있는 아이템이에요!</span></div>
        <div id="ownedGrid" class="bgrid"></div>
      </section>
    </div>

    <!-- 놀이공원 꾸미기 (v0.3 첫 화면의 동상·분수·대문) — 아이템샵 개편 전까지 맨 아래에 -->
    <section id="park" class="sec park hidden">
      <div class="sec-head"><span class="sec-ico">🎡</span><b>놀이공원 꾸미기</b><span class="sec-desc">다이아로 사서 첫 화면을 꾸며요! 동상·분수·대문·이름표·로고</span></div>
      <div id="parkShop"></div>
    </section>

    <section class="coupon-wrap">
      <button id="btnCoupon" class="coupon-btn">🎟️ 쿠폰 입력하기</button>
    </section>
  </main>
</div>

<!-- 캐릭터 꾸미기 화면 -->
<div id="dress" class="dress hidden">
  <header class="dress-top">
    <button id="dressClose" class="dclose" aria-label="닫기">✕</button>
    <b>캐릭터 꾸미기</b>
    <div class="coin-pill small"><img src="assets/ui/coin.webp?v=202611010110" alt=""><b id="dressCoins">0</b></div>
  </header>
  <div class="dress-body">
    <div id="dressWho" class="dress-who"></div>
    <div class="dress-main">
      <div class="dress-stage">
        <button class="dnav prev" id="dPrev" aria-label="이전">‹</button>
        <img id="dressImg" alt="">
        <button class="dnav next" id="dNext" aria-label="다음">›</button>
      </div>
      <div class="dress-info">
        <div id="dName" class="dname">기본 옷</div>
        <div id="dDesc" class="ddesc"></div>
        <div id="dPrice" class="dprice"></div>
        <button id="dAct" class="dact">입기</button>
      </div>
    </div>
    <div class="dress-list-wrap">
      <div id="dressList" class="dress-list"></div>
    </div>
    <div class="dress-tip">입은 옷은 모든 게임과 메뉴 화면에 바로 적용돼요!</div>
  </div>
</div>

<!-- 쿠폰 -->
<div id="coupon" class="modal hidden">
  <div class="mpanel">
    <div class="m-title">🎟️ 쿠폰 입력하기</div>
    <div class="m-body">받은 쿠폰 번호를 입력해 주세요.</div>
    <input id="couponInput" class="coupon-input" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="쿠폰 번호">
    <div id="couponMsg" class="coupon-msg"></div>
    <div class="m-row">
      <button class="mbtn gray" id="couponCancel">닫기</button>
      <button class="mbtn gold" id="couponOk">입력</button>
    </div>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="mpanel">
    <div class="m-title" id="mTitle"></div>
    <div class="m-body" id="mBody"></div>
    <div class="m-row">
      <button class="mbtn gray" id="mCancel">취소</button>
      <button class="mbtn gold" id="mOk">구매</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="../common/chars/looks.js?v=202611010110"></script>
<script src="../common/profile.js?v=202611010110"></script>
<script src="../common/ui.js?v=202611010110"></script>
<script src="shop.js?v=202611010110"></script>
<script src="../common/popup.js?v=202611010110"></script>
</body>
</html>
