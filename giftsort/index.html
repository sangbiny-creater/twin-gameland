<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="은유와 은결">
<meta name="theme-color" content="#5CA9E6">
<meta name="application-name" content="은유와 은결">
<title>은유와 은결</title>
<link rel="manifest" href="../hub/manifest.json?v=202611101847">
<link rel="apple-touch-icon" href="../hub/icons/icon-180.png?v=202611101847">
<link rel="icon" type="image/png" sizes="32x32" href="../hub/icons/favicon-32.png?v=202611101847">
<link rel="icon" type="image/png" sizes="16x16" href="../hub/icons/favicon-16.png?v=202611101847">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/icons/favicon-192.png?v=202611101847">
<link rel="shortcut icon" href="../favicon.ico?v=202611101847">
<link rel="preload" href="../common/fonts/jua.woff2?v=202611101847" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=202611101847">
<link rel="stylesheet" href="../common/pause.css?v=202611101847">
<link rel="stylesheet" href="../common/popup.css?v=202611101847">
<!-- 화면을 한 번에 보여 주기: 그림·글꼴이 다 준비될 때까지 가려 두고 한꺼번에 (common/boot.js) -->
<script src="../common/boot.js?v=202611101847"></script>
</head>
<body>
<div id="safe"></div>
<div id="root">
  <canvas id="bg"></canvas>
  <img id="hero" class="hero hidden" src="" alt="">
  <div id="board"></div>
  <canvas id="fx"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="btnPause" class="sq" aria-label="일시정지">⏸</button>
      <div class="pill moves"><b id="hudMoves">0</b><span>번</span></div>
      <div class="stars3" id="hudStars"><span>★</span><span>★</span><span>★</span></div>
      <div class="stage-lbl" id="hudStage">스테이지 1-1</div>
    </div>
    <div class="hud-sub">
      <div class="pill coins"><img src="../common/ui/coin.webp" alt=""><b id="hudCoin">0</b></div>
      <div class="pill left">남은 카트 <b id="hudLeft">0</b></div>
    </div>
    <div class="items">
      <button id="btnUndo" class="item"><img src="assets/ui/undo.webp?v=202611101847" alt=""><i id="cUndo">3</i><span>되돌리기</span></button>
      <button id="btnHint" class="item"><img src="../common/items/hint.webp?v=202611101847" alt=""><i id="cHint">1</i><span>힌트</span></button>
      <button id="btnAdd" class="item"><img src="assets/ui/addcart.webp?v=202611101847" alt=""><i id="cAdd">1</i><span>카트 추가</span></button>
    </div>
  </div>

  <!-- READY -->
  <div id="ready" class="screen hidden">
    <div class="panel">
      <img class="logo" src="assets/ui/logo.webp?v=202611101847" alt="선물가게 정리">
      <div class="p-title" id="readyTitle">1-1 장난감 거리 1</div>
      <div class="p-text">같은 선물끼리 카트에 4개씩 모아요!</div>
      <div class="p-sub" id="readyInfo">선물 3종류 · 카트 5대</div>
      <div class="row">
        <button id="btnGo" class="btn gold">시작하기</button>
        <button id="btnReadyHome" class="btn white">메인으로</button>
        <button id="btnReadyMap" class="btn white hidden" aria-hidden="true">지도로</button>
      </div>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen dim hidden">
    <div class="panel">
      <div class="p-title">잠깐 쉬어요</div>
      <button id="btnResume" class="btn-start small">계속하기</button>
      <div class="row">
        <button id="btnRetryP" class="btn-sub">다시하기</button>
        <button id="btnMapP" class="btn-sub">지도 보기</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen dim hidden">
    <div class="panel result">
      <div class="r-title" id="resTitle">스테이지 클리어!</div>
      <div class="r-stars" id="resStars"><span>★</span><span>★</span><span>★</span></div>
      <div class="r-box">
        <div><span>📦 옮긴 횟수</span><b id="resMoves">0</b></div>
        <div><span>🛒 완성한 카트</span><b id="resCarts">0</b></div>
        <div><span>🪙 획득 코인</span><b id="resCoin">0</b></div>
      </div>
      <div id="resEarn" class="earn hidden"></div>
      <div class="r-acts">
        <div class="row" id="resRow">
          <button id="btnRetry" class="btn">다시하기</button>
          <button id="btnNext" class="btn">다음 스테이지</button>
        </div>
        <div class="row">
          <button id="btnHomeR" class="btn">메인으로</button>
          <button id="btnMapR" class="btn">지도 보기</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>
<script src="../common/chars/looks.js?v=202611101847"></script>
<script src="../common/profile.js?v=202611101847"></script>
<script src="../common/i18n_data.js?v=202611101847"></script>
<script src="../common/i18n.js?v=202611101847"></script>
<script src="../common/gamepop.js?v=202611101847"></script>
<script src="levels.js?v=202611101847"></script>
<script src="game.js?v=202611101847"></script>
<script src="../common/popup.js?v=202611101847"></script>
</body>
</html>
