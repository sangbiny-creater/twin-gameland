<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="은유와 은결">
<meta name="theme-color" content="#5CA9E6">
<meta name="application-name" content="은유와 은결">
<title>은유와 은결</title>
<link rel="manifest" href="../hub/manifest.json?v=202610272047">
<link rel="apple-touch-icon" href="../hub/icons/icon-180.png?v=202610272047">
<link rel="icon" type="image/png" sizes="32x32" href="../hub/icons/favicon-32.png?v=202610272047">
<link rel="icon" type="image/png" sizes="16x16" href="../hub/icons/favicon-16.png?v=202610272047">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/icons/favicon-192.png?v=202610272047">
<link rel="shortcut icon" href="../favicon.ico?v=202610272047">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202610272047">
</head>
<body>
<div id="safe"></div>
<div id="root">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="btnPause" class="img-btn" aria-label="일시정지"><img src="assets/ui/pause.webp" alt=""></button>
      <div class="pill height"><span class="ico ico-star"></span><b id="hudHeight">0</b>m</div>
      <div class="pill timer" id="timerPill"><img src="assets/ui/time5.webp" alt=""><b id="hudTime">20</b>s</div>
      <div id="hudHearts" class="hearts"></div>
    </div>
    <div class="hud-sub">
      <div class="pill coins"><img src="assets/ui/coin.webp" alt=""><b id="hudCoin">0</b></div>
      <div class="best">BEST <b id="hudBest">0</b>m</div>
      <div id="buffs" class="buffs"></div>
    </div>
    <div class="controls">
      <button id="btnTurn" class="ctl" aria-label="방향 전환"><img id="turnImg" src="assets/ui/btn_left.webp" alt=""><span>방향 전환</span></button>
      <button id="btnUp" class="ctl" aria-label="위로 가기"><img src="assets/ui/btn_up.webp" alt=""><span>위로 가기</span></button>
    </div>
  </div>

  <!-- HOME (단독 실행일 때) -->
  <div id="home" class="screen">
    <img class="logo" src="assets/ui/logo.webp?v=202610272047" alt="은유와 은결의 계단 오르기">
    <div class="home-art"><img src="assets/ui/keyart.webp" alt=""></div>
    <div class="label">누구랑 오를까?</div>
    <div class="chars">
      <button class="char" data-char="eunyu"><img src="assets/chars/eunyu_idle.webp" alt=""><span>은유</span></button>
      <button class="char" data-char="eungyeol"><img src="assets/chars/eungyeol_idle.webp" alt=""><span>은결</span></button>
    </div>
    <button id="btnStart" class="btn-start">START</button>
    <div class="home-row">
      <div class="home-stats"><img src="assets/ui/coin.webp" alt=""><b id="totalCoin">0</b> · BEST <b id="bestAll">0</b>m</div>
      <button id="btnSound" class="round" aria-label="소리"><span class="ico-sound"></span></button>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen dim hidden">
    <div class="panel">
      <div class="p-title">잠깐 쉬어요</div>
      <button id="btnResume" class="btn-start small">계속하기</button>
      <div class="row">
        <button id="btnRetryP" class="btn-sub">다시하기</button>
        <button id="btnHomeP" class="btn-sub">홈으로</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen dim hidden">
    <div class="panel wood">
      <div class="p-title">GAME OVER</div>
      <img id="resFace" class="res-face" src="assets/chars/eunyu_dead.webp" alt="">
      <div class="res-big"><b id="resHeight">0</b>m <i id="resBest" class="badge hidden">NEW BEST!</i></div>
      <div class="res-line">최고 기록 <b id="resBestVal">0</b>m · 코인 <b id="resCoin">0</b></div>
      <div id="resEarn" class="earn hidden"></div>
      <button id="btnRetry" class="btn-blue">다시하기</button>
      <button id="btnHomeR" class="btn-gray">홈으로</button>
    </div>
  </div>

  <div id="rotateHint" class="hidden">📱 세로로 세워서 하면 더 크게 보여요</div>
</div>
<script src="../common/chars/looks.js?v=202610272047"></script>
<script src="../common/profile.js?v=202610272047"></script>
<script src="../common/charv2.js?v=202610272047"></script>
<script src="../common/costume.js?v=202610272047"></script>
<script src="../common/skins.js?v=202610272047"></script>
<script src="game.js?v=202610272047"></script>
</body>
</html>
