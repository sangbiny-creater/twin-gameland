<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="은유와 은결">
<meta name="theme-color" content="#7BC043">
<meta name="application-name" content="은유와 은결">
<title>은유와 은결</title>
<link rel="manifest" href="../hub/manifest.json?v=202610311044">
<link rel="apple-touch-icon" href="../hub/icons/icon-180.png?v=202610311044">
<link rel="icon" type="image/png" sizes="32x32" href="../hub/icons/favicon-32.png?v=202610311044">
<link rel="icon" type="image/png" sizes="16x16" href="../hub/icons/favicon-16.png?v=202610311044">
<link rel="icon" type="image/png" sizes="192x192" href="../hub/icons/favicon-192.png?v=202610311044">
<link rel="shortcut icon" href="../favicon.ico?v=202610311044">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=202610311044">
<link rel="stylesheet" href="../common/pause.css?v=202610311044">
</head>
<body>
<div id="safe"></div>
<div id="root">
  <canvas id="cv"></canvas>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <button id="btnPause" class="sq" aria-label="일시정지">⏸</button>
    </div>
    <div class="hud-sub">
      <div class="best">BEST <b id="hudBest">0</b></div>
      <div class="pill coins"><img src="../common/ui/coin.webp?v=202610311044" alt=""><b id="hudCoin">0</b></div>
    </div>
    <!-- 총점(크게) · 라운드(작게) · 이번 라운드 다트 3개 점수 -->
    <div id="head" class="head">
      <div class="total"><b id="hudScore">0</b><small>점</small><span class="rnd">라운드 <b id="hudRound">1</b>/8</span></div>
      <div class="boxes">
        <div class="bx" id="bx0"><b></b><small></small></div>
        <div class="bx" id="bx1"><b></b><small></small></div>
        <div class="bx" id="bx2"><b></b><small></small></div>
      </div>
    </div>
  </div>

  <!-- READY -->
  <div id="ready" class="screen hidden">
    <div class="panel">
      <img class="logo" src="assets/ui/logo.webp?v=202610311044" alt="은유와 은결의 다트 게임">
      <div class="p-text">① 막대 안 <b>점</b>이 원하는 곳에 오면 <b>꾹</b> 누르기<br>② 누르는 동안 <b>과녁 표시</b>가 위·아래로 움직여요<br>원하는 높이에서 <b>손을 떼면</b> 다트가 슝!</div>
      <div class="legend">
        <div class="lg"><i class="sw t"></i><span>트리플</span><b>점수 ×3</b></div>
        <div class="lg"><i class="sw d"></i><span>더블</span><b>점수 ×2</b></div>
        <div class="lg"><i class="sw b"></i><span>D-BULL</span><b>50점</b></div>
        <div class="lg"><i class="sw o"></i><span>S-BULL</span><b>50점</b></div>
      </div>
      <div class="p-sub">한 라운드에 다트 3개 · 8라운드(24개) 점수를 모두 더해요</div>
      <div class="p-sub" id="readyInfo">BEST 0점</div>
      <div class="row">
        <button id="btnReadyHome" class="btn white">게임 선택</button>
        <button id="btnGo" class="btn gold">시작!</button>
      </div>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen dim hidden">
    <div class="panel">
      <div class="p-title">잠깐 쉬어요</div>
      <button id="btnResume" class="btn-start small">계속하기</button>
      <div class="row">
        <button id="btnRetryP" class="btn-sub">다시하기</button>
        <button id="btnHomeP" class="btn-sub">게임 선택</button>
      </div>
      <div class="ver" id="verTxt"></div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="screen dim hidden">
    <div class="panel result">
      <div class="r-title" id="resTitle">다트 끝!</div>
      <div class="r-score"><b id="resScore">0</b><small>점</small><i id="resBest" class="badge hidden">NEW RECORD!</i></div>
      <div id="resSheet" class="sheet res"></div>
      <div class="r-box">
        <div><span>🎯 불 (D-BULL · S-BULL)</span><b id="resBull">0</b></div>
        <div><span>✨ 트리플 · 더블</span><b id="resTD">0</b></div>
        <div><span>🏆 가장 잘한 라운드</span><b id="resBestR">0</b></div>
        <div><span>🪙 획득 코인</span><b id="resCoin">0</b></div>
        <div><span>👑 BEST 기록</span><b id="resBestVal">0</b></div>
      </div>
      <div id="resEarn" class="earn hidden"></div>
      <div class="r-acts">
        <button id="btnRetry" class="btn gold big">다시하기</button>
        <button id="btnHomeR" class="btn white">게임 선택</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>
<script src="../common/chars/looks.js?v=202610311044"></script>
<script src="../common/profile.js?v=202610311044"></script>
<script src="../common/charv2.js?v=202610311044"></script>
<script src="art.js?v=202610311044"></script>
<script src="game.js?v=202610311044"></script>
</body>
</html>
